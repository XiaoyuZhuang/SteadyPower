name: Publish SteadyPower v0.3.0

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Publish v0.3.0 release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk SteadyPower-v0.3.0.apk

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.0 \
            SteadyPower-v0.3.0.apk \
            --title "SteadyPower v0.3.0" \
            --notes-file RELEASE_NOTES_v0.3.0.md \
            --target "$GITHUB_SHA"
