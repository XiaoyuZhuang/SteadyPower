plugins {
    id 'com.android.application'
}

android {
    namespace 'com.steadypower.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.steadypower.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.0'
    }

    signingConfigs {
        stable {
            storeFile rootProject.file('steadypower-signing.jks')
            storePassword 'steadypower'
            keyAlias 'steadypower'
            keyPassword 'steadypower'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            signingConfig signingConfigs.stable
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
